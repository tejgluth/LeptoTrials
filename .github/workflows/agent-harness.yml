name: Agent harness checks

on:
  push:
    paths: ['agent-harness/**', '.github/workflows/agent-harness.yml']
  pull_request:
    paths: ['agent-harness/**', '.github/workflows/agent-harness.yml']

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent-harness
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent-harness/requirements.lock
      - run: pip install -c requirements.lock -e '.[dev]'
      - run: ruff check src tests scripts examples
      - run: ruff format --check src tests scripts examples
      - run: pytest -q
      - run: leptotrials-harness schemas --check
      - run: python -m build --wheel
